<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapleQuest RPG ??Phaser Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0a1e;
      font-family: 'Segoe UI', sans-serif;
    }

    /* 뷰포트 전체를 덮는 외부 래퍼 */
    #game-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a1e;
    }

    /* 실제 1000×600 게임 박스 — JS가 transform:scale()로 화면에 맞게 키움 */
    #game-scale-box {
      position: relative;
      width: 1000px;
      height: 600px;
      flex-shrink: 0;
      transform-origin: center center;
    }

    /* Phaser 캔버스 컨테이너 */
    #game-container {
      position: absolute;
      inset: 0;
      width: 1000px;
      height: 600px;
    }
    #game-container canvas { display: block; }

    /* DOM UI 오버레이 */
    #ui-root {
      position: absolute;
      inset: 0;
      width: 1000px; height: 600px;
      pointer-events: none;
      z-index: 10;
    }

    #job-select-screen {
      display: none;
      position: absolute;
      inset: 0;
      pointer-events: all;
      background: linear-gradient(180deg, #1a1a3e 0%, #2a1a4e 100%);
      flex-direction: column;
      align-items: center;
      padding: 30px 0 20px;
    }
    #job-select-screen h1 {
      font-size: 38px;
      color: #fff;
      text-shadow: 0 0 20px #4466ff;
      -webkit-text-stroke: 1px #4466ff;
      margin-bottom: 8px;
    }
    #job-select-screen .subtitle {
      font-size: 18px;
      color: #aaaadd;
      margin-bottom: 24px;
    }
    .job-cards { display: flex; gap: 28px; align-items: flex-start; }

    .job-card {
      width: 270px;
      background: rgba(10,10,42,0.95);
      border: 2px solid var(--jc);
      border-radius: 12px;
      padding: 18px 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .job-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 28px var(--jc-dim);
      border-color: rgba(255,255,255,0.55);
    }
    .job-card-icon { font-size: 48px; line-height: 1.1; }
    .job-card-name {
      font-size: 24px;
      font-weight: bold;
      color: var(--jc);
    }
    .job-stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      font-size: 13px;
      color: #ccccee;
    }
    .job-stat-label { width: 68px; flex-shrink: 0; }
    .job-stat-bar-bg {
      flex: 1;
      height: 11px;
      background: #2a2a4a;
      border-radius: 6px;
      overflow: hidden;
    }
    .job-stat-bar-fill {
      height: 100%;
      border-radius: 6px;
      background: var(--jc);
    }
    .job-skills-title {
      font-size: 12px;
      color: #8888bb;
      font-weight: bold;
      margin-top: 4px;
    }
    .job-skill-item { font-size: 12px; color: #aaaacc; text-align: center; }
    .job-select-btn {
      width: calc(100% - 8px);
      padding: 10px;
      margin-top: 8px;
      background: var(--jc);
      border: none;
      border-radius: 8px;
      font-size: 17px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      pointer-events: all;
      font-family: 'Segoe UI', sans-serif;
      transition: filter 0.1s, transform 0.1s;
    }
    .job-select-btn:hover { filter: brightness(1.25); transform: scale(1.04); }
    .job-select-btn:active { filter: brightness(0.9); transform: scale(0.97); }
    #version-text {
      position: absolute;
      bottom: 8px; right: 10px;
      font-size: 11px;
      color: #445566;
    }

    /* ?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧
       HUD
    ?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧 */
    #hud {
      display: none;
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #hud-vignette-top,
    #hud-vignette-bottom {
      position: absolute;
      left: 0;
      width: 100%;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #hud-vignette-top {
      top: 0;
      height: 180px;
      background: linear-gradient(180deg, rgba(4,6,16,0.6) 0%, rgba(4,6,16,0) 100%);
      opacity: 0.75;
    }
    #hud-vignette-bottom {
      bottom: 0;
      height: 160px;
      background: linear-gradient(0deg, rgba(4,6,16,0.66) 0%, rgba(4,6,16,0) 100%);
      opacity: 0.8;
    }
    #hud.hud-high-contrast #hud-vignette-top,
    #hud.hud-high-contrast #hud-vignette-bottom {
      opacity: 1;
    }

    /* 醫뚯긽?? HP/MP/EXP + ?ㅽ꺈 */
    #hud-topleft {
      position: absolute;
      top: 10px; left: 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    #hud-level {
      font-size: 15px;
      color: #fff;
      font-weight: bold;
      text-shadow: 1px 1px 3px #000;
      margin-bottom: 2px;
    }
    .hud-bar-row {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 18px;
    }
    .hud-bar-label {
      font-size: 12px;
      font-weight: bold;
      width: 26px;
      text-shadow: 1px 1px 2px #000;
    }
    .hud-bar-bg {
      width: 190px;
      height: 13px;
      border-radius: 4px;
      overflow: hidden;
    }
    .hud-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.12s;
      min-width: 2px;
    }
    .hud-bar-val {
      font-size: 11px;
      color: #ddd;
      text-shadow: 1px 1px 2px #000;
      min-width: 72px;
    }
    .hp-label  { color: #ff6666; }
    .hp-bg     { background: #330000; }
    #hp-fill   { background: #ff4444; }
    .mp-label  { color: #6688ff; }
    .mp-bg     { background: #000033; }
    #mp-fill   { background: #4466ff; }
    .exp-label { color: #66ff66; }
    .exp-bg    { background: #003300; }
    #exp-fill  { background: #44ff44; }

    #hud-stats { display: flex; gap: 10px; margin-top: 3px; }
    #hud-stats span {
      font-size: 12px; color: #fff;
      text-shadow: 1px 1px 2px #000;
    }

    /* 踰꾪봽 諛?*/
    #buff-bar {
      position: absolute;
      top: 154px; left: 10px;
      display: flex; gap: 6px;
    }
    .buff-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,200,68,0.55);
      border-radius: 6px;
      padding: 3px 6px;
      min-width: 42px;
    }
    .buff-icon-emoji { font-size: 18px; }
    .buff-icon-secs  { font-size: 11px; color: #ffcc44; font-weight: bold; }
    .buff-icon-secs.warn { color: #ff4444; }

    /* ?곗긽?? 肄ㅻ낫 + 硫붿냼 */
    #hud-topright {
      position: absolute;
      top: 140px; right: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #combo-display {
      display: none;
      flex-direction: column;
      align-items: center;
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      padding: 5px 14px;
    }
    #combo-count {
      font-size: 28px; font-weight: bold; color: #fff;
      text-shadow: 1px 1px 3px #000;
    }
    .combo-label { font-size: 12px; color: #888; }
    #meso-display {
      font-size: 14px; color: #ffcc44;
      text-shadow: 1px 1px 2px #000;
      background: rgba(0,0,0,0.38);
      border-radius: 6px;
      padding: 3px 10px;
    }

    /* 테마 토글 버튼 */
    #theme-btn {
      font-size: 12px; color: #cce; cursor: pointer;
      background: rgba(0,0,0,0.42); border: 1px solid rgba(180,160,255,0.3);
      border-radius: 6px; padding: 3px 9px;
      text-shadow: 1px 1px 2px #000;
      transition: background 0.15s, border-color 0.15s;
      pointer-events: all;
    }
    #theme-btn:hover { background: rgba(60,40,100,0.65); border-color: rgba(180,160,255,0.6); }

    /* ?ㅽ궗 諛?*/
    #skill-bar {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 14px;
    }
    .skill-slot {
      position: relative;
      width: 68px; height: 68px;
      background: rgba(10,10,42,0.9);
      border: 2px solid #444455;
      border-radius: 8px;
      overflow: hidden;
    }
    .skill-slot.ready {
      border-color: #44ffff;
      box-shadow: 0 0 10px rgba(68,255,255,0.45);
    }
    .skill-key {
      position: absolute;
      top: 4px; left: 6px;
      font-size: 11px; color: #fff; font-weight: bold;
      text-shadow: 1px 1px 2px #000;
      z-index: 5;
    }
    .skill-icon-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -58%);
      font-size: 26px;
      z-index: 0;
    }
    .skill-name-label {
      position: absolute;
      bottom: 5px; left: 50%;
      transform: translateX(-50%);
      font-size: 9px; color: #bbb;
      white-space: nowrap;
      z-index: 0;
    }
    .skill-cd-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      background: rgba(0,0,0,0.72);
      z-index: 1;
    }
    .skill-cd-text {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 17px; color: #fff; font-weight: bold;
      text-shadow: 1px 1px 3px #000;
      z-index: 3;
    }

    /* 梨꾪똿 濡쒓렇 */
    #chat-log {
      position: absolute;
      bottom: 106px; left: 10px;
      display: flex; flex-direction: column-reverse; gap: 2px;
    }
    .chat-msg { font-size: 12px; color: #cccccc; text-shadow: 1px 1px 2px #000; }

    /* ?쇱떆?뺤? ?ㅻ쾭?덉씠 */
    #pause-overlay {
      display: none;
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.5);
      align-items: center; justify-content: center;
    }
    .pause-panel {
      background: rgba(26,26,74,0.95);
      border: 2px solid #4466ff;
      border-radius: 16px;
      padding: 38px 60px;
      text-align: center;
    }
    .pause-title {
      font-size: 32px; color: #fff; font-weight: bold;
      text-shadow: 0 0 12px #4466ff;
      margin-bottom: 12px;
    }
    .pause-hint { font-size: 17px; color: #aaaadd; }

    /* ?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧
       寃뚯엫?ㅻ쾭 ?붾㈃
    ?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧 */
    #game-over-screen {
      display: none;
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.82);
      align-items: center; justify-content: center;
      pointer-events: all;
    }
    .gameover-panel {
      background: rgba(26,8,8,0.97);
      border: 2px solid #ff2222;
      border-radius: 16px;
      padding: 38px 48px 30px;
      width: 400px; text-align: center;
    }
    .gameover-title {
      font-size: 36px; color: #ff4444; font-weight: bold;
      text-shadow: 0 0 16px #ff2222;
      margin-bottom: 22px;
    }
    .gameover-stats { width: 100%; margin-bottom: 20px; }
    .gameover-stat-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 0; border-bottom: 1px solid #2a2a44; font-size: 16px;
    }
    .gameover-stat-row:last-child { border-bottom: none; }
    .gameover-stat-label { color: #9999bb; }
    .gameover-stat-value { color: #fff; font-weight: bold; }
    .gameover-buttons {
      display: flex; gap: 14px; justify-content: center; margin-bottom: 12px;
    }
    .gameover-btn {
      padding: 11px 22px; border: none; border-radius: 8px;
      font-size: 17px; font-weight: bold; color: #fff;
      cursor: pointer; font-family: 'Segoe UI', sans-serif;
      transition: filter 0.1s, transform 0.1s;
    }
    .gameover-btn:hover  { filter: brightness(1.2); transform: scale(1.04); }
    .gameover-btn:active { transform: scale(0.96); }
    .gameover-btn-restart   { background: #44aa44; }
    .gameover-btn-changejob { background: #4444aa; }
    .gameover-hint { font-size: 13px; color: #445566; }
  </style>
</head>
<body>
  <div id="game-wrapper">
  <div id="game-scale-box">
    <div id="game-container"></div>
    <div id="ui-root">

      <!-- ??? 吏곸뾽 ?좏깮 ?붾㈃ ??? -->
      <div id="job-select-screen">
        <h1>??MapleQuest RPG</h1>
        <p class="subtitle">직업을 선택하세요</p>
        <div class="job-cards" id="job-cards-container"></div>
        <div id="version-text">Phaser Edition v7.0</div>
      </div>

      <!-- ??? HUD ??? -->
      <div id="hud">
        <div id="hud-vignette-top"></div>
        <div id="hud-vignette-bottom"></div>

        <!-- 醫뚯긽?? HP / MP / EXP + ?ㅽ꺈 -->
        <div id="hud-topleft">
          <div id="hud-level">Lv.1 ⚔️ 전사</div>
          <div class="hud-bar-row">
            <span class="hud-bar-label hp-label">HP</span>
            <div class="hud-bar-bg hp-bg"><div class="hud-bar-fill" id="hp-fill"></div></div>
            <span class="hud-bar-val" id="hp-val">150/150</span>
          </div>
          <div class="hud-bar-row">
            <span class="hud-bar-label mp-label">MP</span>
            <div class="hud-bar-bg mp-bg"><div class="hud-bar-fill" id="mp-fill"></div></div>
            <span class="hud-bar-val" id="mp-val">30/30</span>
          </div>
          <div class="hud-bar-row">
            <span class="hud-bar-label exp-label">EXP</span>
            <div class="hud-bar-bg exp-bg"><div class="hud-bar-fill" id="exp-fill"></div></div>
            <span class="hud-bar-val" id="exp-val">0/100</span>
          </div>
          <div id="hud-stats">
            <span id="stat-atk">공격력 15</span>
            <span id="stat-crit">치명타 10%</span>
            <span id="stat-kills">처치 0</span>
          </div>
        </div>

        <!-- 踰꾪봽 諛?-->
        <div id="buff-bar"></div>

        <!-- ?곗긽?? 肄ㅻ낫 + 硫붿냼 -->
        <div id="hud-topright">
          <div id="combo-display">
            <span id="combo-count">0</span>
            <span class="combo-label">COMBO</span>
          </div>
          <div id="meso-display">메소 0</div>
          <button id="theme-btn" title="배경 테마 변경">🌅 황혼</button>
        </div>

        <!-- ?ㅽ궗 諛?-->
        <div id="skill-bar">
          <div class="skill-slot" id="skill-slot-0">
            <span class="skill-key">Z</span>
            <span class="skill-icon-text" id="skill-icon-0"></span>
            <div class="skill-cd-overlay" id="skill-cd-0" style="height:0"></div>
            <span class="skill-cd-text" id="skill-cd-text-0"></span>
            <span class="skill-name-label" id="skill-name-0">?ㅽ궗1</span>
          </div>
          <div class="skill-slot" id="skill-slot-1">
            <span class="skill-key">X</span>
            <span class="skill-icon-text" id="skill-icon-1"></span>
            <div class="skill-cd-overlay" id="skill-cd-1" style="height:0"></div>
            <span class="skill-cd-text" id="skill-cd-text-1"></span>
            <span class="skill-name-label" id="skill-name-1">?ㅽ궗2</span>
          </div>
          <div class="skill-slot" id="skill-slot-2">
            <span class="skill-key">C</span>
            <span class="skill-icon-text" id="skill-icon-2"></span>
            <div class="skill-cd-overlay" id="skill-cd-2" style="height:0"></div>
            <span class="skill-cd-text" id="skill-cd-text-2"></span>
            <span class="skill-name-label" id="skill-name-2">?ㅽ궗3</span>
          </div>
        </div>

        <!-- 梨꾪똿 濡쒓렇 -->
        <div id="chat-log">
          <div class="chat-msg" id="chat-0"></div>
          <div class="chat-msg" id="chat-1"></div>
          <div class="chat-msg" id="chat-2"></div>
          <div class="chat-msg" id="chat-3"></div>
          <div class="chat-msg" id="chat-4"></div>
        </div>

        <!-- ?쇱떆?뺤? ?ㅻ쾭?덉씠 -->
        <div id="pause-overlay">
          <div class="pause-panel">
            <div class="pause-title">???쇱떆?뺤?</div>
            <div class="pause-hint">[P] ?먮뒗 [ESC] 怨꾩냽?섍린</div>
            <div class="pause-hint" style="color:#445566;font-size:13px;margin-top:8px">Phaser Edition</div>
          </div>
        </div>
      </div><!-- end #hud -->

      <!-- ??? 寃뚯엫?ㅻ쾭 ?붾㈃ ??? -->
      <div id="game-over-screen">
        <div class="gameover-panel">
          <div class="gameover-title">GAME OVER</div>
          <div class="gameover-stats" id="gameover-stats"></div>
          <div class="gameover-buttons">
            <button class="gameover-btn gameover-btn-restart" id="btn-restart">다시하기</button>
            <button class="gameover-btn gameover-btn-changejob" id="btn-changejob">직업 변경</button>
          </div>
          <div class="gameover-hint">[R] 다시하기&nbsp;|&nbsp; [J] 직업 변경</div>
        </div>
      </div>

    </div><!-- end #ui-root -->
  </div><!-- end #game-wrapper -->

  <!-- Phaser 寃뚯엫 -->
  <script type="module" src="./src/phaser/main.js?v=7"></script>

  <!-- DOM UI 濡쒖쭅 -->
  <script type="module">
    import { JOBS } from './data/jobs.js';
    const JOB_LABELS = { warrior: '전사', thief: '도적', archer: '궁수' };
    const JOB_ICONS = { warrior: '⚔️', thief: '🗡️', archer: '🏹' };
    const TIER_LABELS = {
      warrior: ['전사', '기사', '버서커', '히어로'],
      thief: ['도적', '로그', '나이트', '섀도우'],
      archer: ['궁수', '헌터', '레인저', '보우마스터']
    };
    const SKILL_LABELS = {
      powerStrike: '파워 스트라이크',
      powerStrikePlus: '강화 타격',
      slashBlast: '슬래시 블래스트',
      shieldCounter: '실드 카운터',
      doubleStab: '더블 스탭',
      quadStab: '쿼드 스탭',
      assassinate: '어쌔시네이트',
      stealthBackstab: '스텔스 백스탭',
      doubleShot: '더블 샷',
      tripleShot: '트리플 샷',
      explosiveArrow: '폭발 화살',
      arrowRain: '애로우 레인',
      rage: '레이지',
      holyLight: '홀리 라이트',
      haste: '헤이스트',
      swiftness: '신속',
      soul: '소울 애로우',
      keenEyes: '명중의 눈',
    };

    function getSkillLabel(skill) {
      if (!skill) return '';
      return SKILL_LABELS[skill.type] || SKILL_LABELS[skill.buff] || skill.name || '스킬';
    }

    const THEMES = [
      { id: 'dusk_forest', label: '🌅 황혼' },
      { id: 'night_ruins', label: '🌙 심야' },
      { id: 'dawn',        label: '🌄 새벽' },
      { id: 'cave',        label: '🕳️ 동굴' },
    ];
    let currentThemeIdx = 0;

    function emitBackgroundProfileChange(themeId) {
      const theme = themeId || THEMES[currentThemeIdx].id;
      window.dispatchEvent(new CustomEvent('backgroundProfileChange', { detail: {
        quality: 'high',
        theme,
        ambienceEnabled: true,
      }}));
    }

    function cycleTheme() {
      currentThemeIdx = (currentThemeIdx + 1) % THEMES.length;
      const t = THEMES[currentThemeIdx];
      const btn = document.getElementById('theme-btn');
      if (btn) btn.textContent = t.label;
      emitBackgroundProfileChange(t.id);
    }

    // hex ??rgba ?ы띁
    function hexToRgba(hex, a) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return `rgba(${r},${g},${b},${a})`;
    }

    // ?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧
    //  吏곸뾽 ?좏깮 移대뱶 ?숈쟻 ?앹꽦
    // ?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧
    const cardsContainer = document.getElementById('job-cards-container');
    ['warrior','thief','archer'].forEach(jobId => {
      const job = JOBS[jobId];
      const c   = job.color;

      const card = document.createElement('div');
      card.className = 'job-card';
      card.style.setProperty('--jc',     c);
      card.style.setProperty('--jc-dim', hexToRgba(c, 0.35));

      const stats = [
        { label:'기본 HP',  pct: job.baseHp    / 150 * 100 },
        { label:'이동 속도', pct: job.speed      /   7 * 100 },
        { label:'기본 공격', pct: job.baseAttack /  18 * 100 },
      ];

      card.innerHTML = `
        <div class="job-card-icon">${JOB_ICONS[jobId]}</div>
        <div class="job-card-name">${JOB_LABELS[jobId]}</div>
        ${stats.map(s => `
          <div class="job-stat-row">
            <span class="job-stat-label">${s.label}</span>
            <div class="job-stat-bar-bg">
              <div class="job-stat-bar-fill" style="width:${Math.max(4,s.pct)}%"></div>
            </div>
          </div>
        `).join('')}
        <div class="job-skills-title">시작 스킬</div>
        ${jobId === 'thief' ? `<div class="job-skill-item">🗡️ [A] 강화공격 (5콤보)</div>` : ''}
        ${job.tiers[0].skills.map(s => `
          <div class="job-skill-item">${s.icon || "✨"} [${s.key}] ${getSkillLabel(s)}</div>
        `).join('')}
        <button class="job-select-btn">선택하기</button>
      `;

      card.querySelector('.job-select-btn').addEventListener('click', e => {
        e.stopPropagation();
        window.dispatchEvent(new CustomEvent('jobSelected', { detail: { job: jobId } }));
      });

      cardsContainer.appendChild(card);
    });

    // ?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧
    //  HUD ?낅뜲?댄듃 (留??꾨젅???섏떊)
    // ?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧
    window.addEventListener('gameHudUpdate', e => {
      const d    = e.detail;
      const job  = JOBS[d.job];
      const tierName = (TIER_LABELS[d.job] && TIER_LABELS[d.job][d.tier]) || JOB_LABELS[d.job];
      const hudRoot = document.getElementById('hud');

      // ?덈꺼/吏곸뾽
      document.getElementById('hud-level').textContent = `Lv.${d.level} ${JOB_ICONS[d.job] || ''} ${tierName}`;

      // HP
      const hpRatio = d.hp / d.maxHp;
      const hpFill  = document.getElementById('hp-fill');
      hpFill.style.width      = (Math.max(0, hpRatio) * 100) + '%';
      hpFill.style.background = hpRatio > 0.5 ? '#ff4444' : hpRatio > 0.25 ? '#ff8800' : '#ff2222';
      document.getElementById('hp-val').textContent = `${Math.ceil(d.hp)}/${d.maxHp}`;

      // MP
      document.getElementById('mp-fill').style.width = (Math.max(0, d.mp / d.maxMp) * 100) + '%';
      document.getElementById('mp-val').textContent  = `${Math.ceil(d.mp)}/${d.maxMp}`;

      // EXP
      document.getElementById('exp-fill').style.width = (Math.max(0, d.exp / d.expToLevel) * 100) + '%';
      document.getElementById('exp-val').textContent  = `${d.exp}/${d.expToLevel}`;

      // ?ㅽ꺈
      document.getElementById('stat-atk').textContent   = `공격력 ${Math.floor(d.attack)}`;
      document.getElementById('stat-crit').textContent  = `치명타 ${d.critChance.toFixed(1)}%`;
      document.getElementById('stat-kills').textContent = `처치 ${d.kills}`;

      // ?ㅽ궗 諛?
      for (let i = 0; i < 3; i++) {
        const skill   = d.skills?.[i];
        const cd      = Math.max(0, d.skillCooldowns[i]);
        const isReady = cd <= 0;
        const slot    = document.getElementById(`skill-slot-${i}`);

        slot.className = 'skill-slot' + (isReady ? ' ready' : '');

        if (skill) {
          // 키 라벨: skill.key 우선, 없으면 기본값 Z/X/C
          const keyEl = slot.querySelector('.skill-key');
          if (keyEl) keyEl.textContent = skill.key || ['Z','X','C'][i];

          document.getElementById(`skill-icon-${i}`).textContent = isReady ? (skill.icon || '?') : '';
          const label = getSkillLabel(skill);
          const nm = label.length > 6 ? label.slice(0, 6) : label;
          document.getElementById(`skill-name-${i}`).textContent = nm;

          const overlay = document.getElementById(`skill-cd-${i}`);
          const cdText  = document.getElementById(`skill-cd-text-${i}`);
          if (cd > 0 && skill.cooldown > 0) {
            overlay.style.height = (Math.min(1, cd / skill.cooldown) * 100) + '%';
            cdText.textContent   = (cd / 60).toFixed(1);
          } else {
            overlay.style.height = '0';
            cdText.textContent   = '';
          }
        }
      }

      // 肄ㅻ낫
      const comboEl = document.getElementById('combo-display');
      if (d.combo >= 2) {
        comboEl.style.display = 'flex';
        const cnt = document.getElementById('combo-count');
        cnt.textContent = d.combo;
        cnt.style.color = d.combo >= 50 ? '#ff2244' : d.combo >= 20 ? '#ffaa00' : '#ffffff';
      } else {
        comboEl.style.display = 'none';
      }

      // 硫붿냼
      document.getElementById('meso-display').textContent = `메소 ${d.meso}`;

      // 버프 바
      const buffBar = document.getElementById('buff-bar');
      buffBar.innerHTML = '';
      Object.entries(d.buffs).forEach(([, buff]) => {
        const secs = Math.ceil(buff.duration / 60);
        const icon = buff.icon || '?';
        const div  = document.createElement('div');
        div.className = 'buff-icon';
        div.innerHTML = `<span class="buff-icon-emoji">${icon}</span><span class="buff-icon-secs${secs <= 3 ? ' warn' : ''}">${secs}s</span>`;
        buffBar.appendChild(div);
      });

      // 梨꾪똿
      if (d.chatMessages) {
        for (let i = 0; i < 5; i++) {
          const msg = d.chatMessages[i];
          document.getElementById(`chat-${i}`).textContent = msg ? msg.text : '';
        }
      }

      // ?쇱떆?뺤?
      document.getElementById('pause-overlay').style.display = d.paused ? 'flex' : 'none';

      const needsHighContrast = d.combo >= 20 || (d.hp / d.maxHp) <= 0.3;
      hudRoot.classList.toggle('hud-high-contrast', needsHighContrast);
    });

    // ?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧
    //  寃뚯엫?ㅻ쾭
    // ?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧
    let _lastStats = null;

    window.addEventListener('gameOver', e => {
      _lastStats = e.detail;
      const s = e.detail;
      const t    = Math.floor((s.playFrames || 0) / 60);
      const mins = Math.floor(t / 60);
      const secs = t % 60;

      document.getElementById('gameover-stats').innerHTML = [
        { label: '도달 레벨', value: `Lv.${s.level || 1}` },
        { label: '처치한 몬스터', value: `${s.kills || 0}마리` },
        { label: '획득 메소', value: `${s.meso || 0} 메소` },
        { label: '플레이 시간', value: `${mins}분 ${secs}초` },
      ].map(({ label, value }) => `
        <div class="gameover-stat-row">
          <span class="gameover-stat-label">${label}</span>
          <span class="gameover-stat-value">${value}</span>
        </div>
      `).join('');

      document.getElementById('hud').style.display           = 'none';
      document.getElementById('game-over-screen').style.display = 'flex';
    });

    // 寃뚯엫?ㅻ쾭 踰꾪듉
    document.getElementById('btn-restart').addEventListener('click', () => {
      window.dispatchEvent(new CustomEvent('gameRestart', { detail: { job: _lastStats?.job || 'warrior' } }));
    });
    document.getElementById('btn-changejob').addEventListener('click', () => {
      window.dispatchEvent(new CustomEvent('gameChangeJob'));
    });

    // R / J ???⑥텞??(寃뚯엫?ㅻ쾭 ?붾㈃?먯꽌)
    document.addEventListener('keydown', e => {
      const goScreen = document.getElementById('game-over-screen');
      if (!goScreen.style.display || goScreen.style.display === 'none') return;
      if (e.key === 'r' || e.key === 'R') {
        window.dispatchEvent(new CustomEvent('gameRestart', { detail: { job: _lastStats?.job || 'warrior' } }));
      } else if (e.key === 'j' || e.key === 'J') {
        window.dispatchEvent(new CustomEvent('gameChangeJob'));
      }
    });

    window.addEventListener('jobSelected', () => setTimeout(() => emitBackgroundProfileChange(), 0));
    window.addEventListener('gameRestart', () => setTimeout(() => emitBackgroundProfileChange(), 0));

    document.getElementById('theme-btn').addEventListener('click', cycleTheme);

    function sendCheat(command, value) {
      window.dispatchEvent(new CustomEvent('mqCheatCommand', { detail: { command, value } }));
    }

    window.mqCheat = {
      help() {
        console.log('[mqCheat] setLevel(level), setMeso(amount), addMeso(amount), heal(), godMode(on)');
      },
      setLevel(level) { sendCheat('setLevel', level); },
      setMeso(amount) { sendCheat('setMeso', amount); },
      addMeso(amount) { sendCheat('addMeso', amount); },
      heal() { sendCheat('heal', true); },
      godMode(on = true) { sendCheat('godMode', !!on); },
    };

    // Quick aliases
    window.setLevel = (level) => window.mqCheat.setLevel(level);
    window.setMeso = (amount) => window.mqCheat.setMeso(amount);
    window.addMeso = (amount) => window.mqCheat.addMeso(amount);
    window.heal = () => window.mqCheat.heal();
    window.godMode = (on = true) => window.mqCheat.godMode(on);

    console.log('[Cheat] Console commands ready: setLevel, setMeso, addMeso, heal, godMode');

    emitBackgroundProfileChange();
  </script>


  <script>
    // #game-scale-box를 화면 크기에 맞게 비율 유지 스케일링
    function rescaleGame() {
      const box = document.getElementById('game-scale-box');
      if (!box) return;
      const scaleX = window.innerWidth  / 1000;
      const scaleY = window.innerHeight / 600;
      const scale  = Math.min(scaleX, scaleY) * 0.88;
      box.style.transform = 'scale(' + scale + ')';
    }
    window.addEventListener('resize', rescaleGame);
    rescaleGame();
  </script>


</body>
</html>
